databases:
  - name: leadhunter-db
    plan: free
    databaseName: leadhunter
    user: leadhunter

services:
  - type: web
    name: leadhunter-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: leadhunter-db
          property: connectionString
      - key: CELERY_ENABLED
        value: "false"
      - key: SERPAPI_KEY
        value: "add_your_serpapi_key_here" # Add this in Render Dashboard
