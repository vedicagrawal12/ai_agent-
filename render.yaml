databases:
  - name: leadhunter-db
    plan: free # Change to a paid plan for production
    databaseName: leadhunter
    user: leadhunter

services:
  - type: redis
    name: leadhunter-redis
    plan: free # Change to a paid plan for production
    ipAllowList: [] # internal connections only

  - type: web
    name: leadhunter-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: leadhunter-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: leadhunter-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: leadhunter-redis
          property: connectionString
      - key: CELERY_ENABLED
        value: "true"
      - key: SERPAPI_KEY
        value: "add_your_serpapi_key_here" # Add this in Render Dashboard

  - type: worker
    name: leadhunter-celery-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A celery_worker.celery_app worker --loglevel=info
    plan: free
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: leadhunter-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: leadhunter-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: leadhunter-redis
          property: connectionString
      - key: CELERY_ENABLED
        value: "true"

  - type: worker
    name: leadhunter-celery-beat
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A celery_worker.celery_app beat --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadhunter-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: leadhunter-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: leadhunter-redis
          property: connectionString
      - key: CELERY_ENABLED
        value: "true"
