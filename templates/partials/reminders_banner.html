<!-- ======== Follow-up Reminders Banner ======== -->
<div id="followupRemindersBanner" style="display: none; margin-bottom: 24px;">
    <div style="background: rgba(249, 115, 22, 0.15); border: 1px solid var(--accent-orange); border-radius: var(--radius-md); padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px); animation: pulse-border 2s infinite ease-in-out;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 1.6rem; animation: swing 2s infinite ease-in-out; transform-origin: top center;">🔔</span>
            <div>
                <h4 style="margin: 0; font-size: 0.95rem; font-weight: 700; color: var(--accent-orange);">Pending Follow-up Reminders!</h4>
                <p style="margin: 4px 0 0 0; font-size: 0.85rem; color: var(--text-secondary);" id="followupRemindersText">You have 0 follow-up tasks due today.</p>
            </div>
        </div>
        <button id="viewFollowupsBtn" class="btn btn-secondary btn-sm" style="border: 1px solid var(--accent-orange); color: var(--accent-orange); background: rgba(249, 115, 22, 0.05); padding: 8px 16px; font-size: 0.8rem; cursor: pointer; border-radius: 4px; font-weight: 600; transition: all 0.3s ease;">View Follow-ups</button>
    </div>
</div>
