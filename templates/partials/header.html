<!-- ======== Header ======== -->
<header class="app-header">
    <div class="app-logo">
        <div class="app-logo-icon">🎯</div>
        <div class="app-logo-text">
            <h1>LeadHunter AI</h1>
            <p>Find businesses that need your services</p>
        </div>
    </div>
    <div class="header-actions">
        {% if session.get('username') %}
        <span style="font-size: 0.85rem; color: var(--text-secondary); margin-right: 8px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-color); padding: 4px 10px; border-radius: var(--radius-sm); background: var(--bg-card);"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; display: inline-block; vertical-align: middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 1114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>{{ session.get('username') }}</span>
        {% endif %}
        <button id="historyBtn" class="btn btn-ghost btn-icon" data-tooltip="Search History"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-9-9c2.517 0 4.79 1.026 6.4 2.682L20.25 7.5" /></svg></button>
        <button id="settingsBtn" class="btn btn-secondary btn-icon" data-tooltip="Settings"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.43l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg></button>
        {% if is_admin %}
        <a href="/admin" class="btn btn-ghost btn-icon" data-tooltip="Admin Control Console" style="text-decoration: none;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" /></svg></a>
        {% endif %}
        {% if session.get('username') %}
        <a href="/logout" class="btn btn-ghost btn-icon" data-tooltip="Logout" style="text-decoration: none;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 00 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" /></svg></a>
        {% else %}
        <a href="/login" class="btn btn-ghost" style="text-decoration: none; font-size: 0.85rem; font-weight: 700; padding: 8px 16px; display: inline-flex; align-items: center;">Log In</a>
        <a href="/signup" class="btn btn-primary" style="text-decoration: none; font-size: 0.85rem; font-weight: 800; padding: 8px 16px; box-shadow: var(--shadow-glow-cyan); display: inline-flex; align-items: center;">Sign Up</a>
        {% endif %}
    </div>
</header>
