<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found — LeadHunter AI.">
    <title>404 Page Not Found — LeadHunter AI</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
    <style>
        .error-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: var(--space-xl) var(--space-lg);
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }
        .error-container {
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--space-3xl) var(--space-xl);
            max-width: 600px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(12px);
            transition: border-color var(--transition-base), box-shadow var(--transition-base);
        }
        .error-container:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-glow-cyan);
        }
        .error-code {
            font-family: var(--font-display);
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            color: var(--accent-cyan);
            text-shadow: var(--shadow-glow-cyan);
            margin-bottom: var(--space-md);
            animation: pulse-glow 2s infinite ease-in-out;
        }
        .error-title {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: var(--space-sm);
            letter-spacing: -0.02em;
        }
        .error-message {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-xl);
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            justify-content: center;
            gap: var(--space-md);
        }
        .btn-glow {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            font-weight: 700;
            text-decoration: none;
            padding: 14px 28px;
            font-size: 1rem;
            border-radius: var(--radius-md);
            transition: all var(--transition-base);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }
        .btn-glow:hover {
            background: #00d8e6;
            box-shadow: var(--shadow-glow-cyan);
            transform: translateY(-2px);
        }
        .btn-glow:active {
            transform: translateY(0);
        }
        .btn-outline {
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            font-weight: 600;
            text-decoration: none;
            padding: 14px 28px;
            font-size: 1rem;
            border-radius: var(--radius-md);
            transition: all var(--transition-base);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-outline:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.03);
            transform: translateY(-2px);
        }
        .btn-outline:active {
            transform: translateY(0);
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(0, 240, 255, 0.2)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.5)); }
        }
    </style>
</head>
<body>
    <div class="error-wrapper">
        <div class="error-container">
            <div class="error-code">404</div>
            <h1 class="error-title">Lost in Space</h1>
            <p class="error-message">
                The page you are looking for has been moved, deleted, or does not exist. Let's get you back to track.
            </p>
            <div class="error-actions">
                <a href="/" class="btn-glow">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2;"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>
                    Dashboard
                </a>
                <a href="javascript:history.back()" class="btn-outline">
                    Back
                </a>
            </div>
        </div>
    </div>
</body>
</html>
